apiVersion: v1
kind: Service
metadata:
  name: {{ include "kanban.clientServiceName" . }}
  labels:
    {{- include "kanban.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  type: {{ .Values.client.service.type }}
  selector:
    {{- include "kanban.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: client
  ports:
    - name: http
      port: {{ .Values.client.service.port }}
      targetPort: http
      protocol: TCP

