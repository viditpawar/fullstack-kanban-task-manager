services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kanban-server
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - server-data:/app/src/data

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kanban-client
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  server-data:
